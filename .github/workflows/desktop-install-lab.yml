name: Guardian Desktop Install Lab

on:
  pull_request:
    branches:
      - packaging/desktop-trust-v1
  push:
    branches:
      - packaging/desktop-install-lab-v1

permissions:
  contents: read

jobs:
  windows-install-lab:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release foundation
        run: npm run release:validate

      - name: Validate desktop packaging policy
        run: node tests/desktop-packaging.test.js

      - name: Validate desktop trust policy
        run: node tests/desktop-trust.test.js

      - name: Validate install lab policy
        run: node tests/desktop-install-lab.test.js

      - name: Stage desktop assets
        run: npm run desktop:assets

      - name: Check Rust shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Guardian syntax checks
        run: npm run check

      - name: Run Guardian regression suite
        run: npm test

      - name: Build unsigned NSIS installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked

      - name: Silent install and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'installer missing' }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer ExitCode=$($install.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA 'RUMBO Guardian'
          $appExe = Join-Path $installDir 'rumbo-guardian-desktop.exe'
          if (-not (Test-Path $appExe)) { throw "installed executable missing: $appExe" }

          $smoke = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5
          if ($smoke.HasExited) { throw "desktop smoke process exited early: $($smoke.ExitCode)" }
          Stop-Process -Id $smoke.Id -Force
          $smoke.WaitForExit()

          $uninstaller = Get-ChildItem $installDir -Filter 'uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall ExitCode=$($uninstall.ExitCode)" }

          for ($i = 0; $i -lt 30 -and (Test-Path $appExe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $appExe) { throw 'uninstall did not remove installed executable' }
          if (Test-Path $installDir) {
            $residual = @(Get-ChildItem -Force $installDir -ErrorAction SilentlyContinue)
            if ($residual.Count -gt 0) { throw "uninstall left residual files in $installDir" }
          }

          New-Item -ItemType Directory -Force -Path build | Out-Null
          [ordered]@{
            schema = 'rumbo.desktop.install-lab/v1'
            source_sha = '${{ github.event.pull_request.head.sha || github.sha }}'
            runner = 'windows-latest'
            install_mode = 'currentUser'
            silent_install = $true
            installed_executable = $true
            smoke_process = $true
            silent_uninstall = $true
            residual_files = 0
          } | ConvertTo-Json | Set-Content -Encoding utf8 build/install-lab.json

      - name: Upload install lab evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rumbo-guardian-install-lab-evidence
          path: build/install-lab.json
          if-no-files-found: error

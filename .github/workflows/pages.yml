name: Guardian Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static portfolio demo
        run: |
          mkdir -p site
          cp index.html styles.css guardian-core.js app.js sw.js manifest.webmanifest site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
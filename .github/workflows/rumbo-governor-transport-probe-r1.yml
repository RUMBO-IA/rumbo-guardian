name: RUMBO Governor Transport Probe R1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, rumbo-ci-linux]
    timeout-minutes: 5
    steps:
      - name: Prove runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "HOSTNAME=$(hostname)"
          id

      - name: Probe shared governor and target checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("/mnt/c/Users/Usuario/.rumbo/github-mutation-governor.json"),
              Path.home()/".rumbo"/"github-mutation-governor.json",
          ]
          found = next((p for p in candidates if p.is_file()), None)
          print("GOVERNOR_STATE_FOUND=" + str(found is not None).lower())
          if found:
              print("GOVERNOR_STATE_LOCATION=" + ("windows_mount" if str(found).startswith("/mnt/c/") else "runner_home"))
              print("GOVERNOR_STATE_SIZE=" + str(found.stat().st_size))

          roots = [
              Path("/mnt/c/Users/Usuario"),
              Path.home(),
          ]
          hits = []
          for root in roots:
              if not root.is_dir():
                  continue
              try:
                  for gitdir in root.glob("**/.git"):
                      repo = gitdir.parent
                      if repo.name == "rumbo-control-queue":
                          hits.append(str(repo))
                          if len(hits) >= 5:
                              break
              except Exception:
                  pass
              if len(hits) >= 5:
                  break
          print("TARGET_CHECKOUT_COUNT=" + str(len(hits)))
          for i, hit in enumerate(hits):
              print(f"TARGET_CHECKOUT_{i}={hit}")
          PY

      - name: Probe persistent GitHub CLI identity without workflow token
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set +e
          gh auth status >/tmp/gh-auth-status.txt 2>&1
          rc=$?
          echo "PERSISTENT_GH_AUTH_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            login=$(gh api user --jq '.login' 2>/dev/null)
            id=$(gh api user --jq '.id' 2>/dev/null)
            echo "PERSISTENT_GH_LOGIN=$login"
            echo "PERSISTENT_GH_ID=$id"
            if gh api repos/RUMBO-IA/rumbo-control-queue --jq '.full_name' >/tmp/target-repo.txt 2>/dev/null; then
              echo "TARGET_REPO_PERSISTENT_READ=true"
            else
              echo "TARGET_REPO_PERSISTENT_READ=false"
            fi
          else
            echo "TARGET_REPO_PERSISTENT_READ=false"
          fi
          exit 0

      - name: Verdict
        shell: bash
        run: echo "RUMBO_GOVERNOR_TRANSPORT_PROBE_COMPLETE"

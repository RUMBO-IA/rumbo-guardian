name: Guardian Desktop Trust Build

on:
  pull_request:
    branches:
      - packaging/desktop-foundation-v1
  push:
    branches:
      - packaging/desktop-trust-v1

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release foundation
        run: node tools/validate-release.mjs --product packaging/product.json --release packaging/release.json --extension extension/manifest.json --package package.json --allow-historical-baseline

      - name: Validate desktop packaging policy
        run: node tests/desktop-packaging.test.js

      - name: Validate desktop trust policy
        run: node tests/desktop-trust.test.js

      - name: Stage desktop assets
        run: npm run desktop:assets

      - name: Check Rust shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Guardian syntax checks
        run: npm run check

      - name: Run Guardian regression suite
        run: npm test

      - name: Build unsigned NSIS installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked

      - name: Prepare trust output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: build/guardian.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'src-tauri/target/release/bundle/nsis/*-setup.exe'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          sbom-path: 'build/guardian.spdx.json'

      - name: Upload unsigned installer and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rumbo-guardian-windows-trust-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            build/guardian.spdx.json
          if-no-files-found: error

name: Guardian Desktop Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc

      - name: Validate release foundation
        run: npm run release:validate

      - name: Validate desktop packaging policy
        run: node tests/desktop-packaging.test.js

      - name: Stage desktop assets
        run: npm run desktop:assets

      - name: Check Rust shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Guardian syntax checks
        run: npm run check

      - name: Run Guardian regression suite
        run: npm test

      - name: Build unsigned NSIS installer with bounded transient-download retries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A failed native command must be inspected before PowerShell raises an error.
          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $log = Join-Path $env:RUNNER_TEMP "guardian-nsis-bundle-attempt-$attempt.log"
            & npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked *> $log
            $exit = $LASTEXITCODE
            Get-Content -LiteralPath $log | ForEach-Object { Write-Host $_ }
            if ($exit -eq 0) {
              Write-Host "NSIS bundle PASS on bounded attempt $attempt"
              break
            }
            $output = Get-Content -LiteralPath $log -Raw
            # Retry ONLY transient GitHub binary-release HTTP failures.
            # All compiler, test, hash or integrity errors fail without retry.
            if ($attempt -ge $maxAttempts -or $output -notmatch '(?i)\bhttp status:\s*(502|503|504)\b') {
              throw "NSIS bundle failed (exit=$exit), no further retries permitted"
            }
            Write-Warning "Transient NSIS tool download error; retrying bounded attempt $($attempt+1)/$maxAttempts"
            Start-Sleep -Seconds (5 * $attempt)
          }

      - name: Prepare SBOM output
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: build/guardian.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumbo-guardian-windows-trust-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            build/guardian.spdx.json
          if-no-files-found: error

  # Isolate attestation write permissions away from code under pull_request.
  # Only workflow_dispatch after an authorized human trigger may mint provenance.
  attest-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: windows-nsis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download unsigned installer and SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rumbo-guardian-windows-trust-candidate
          path: attest-candidate

      - name: Verify downloaded inputs exist
        shell: bash
        run: |
          test -s attest-candidate/build/guardian.spdx.json
          find attest-candidate/src-tauri/target/release/bundle/nsis -maxdepth 1 -type f -name '*-setup.exe' -size +0c | grep -q .

      - name: Attest unsigned installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'attest-candidate/src-tauri/target/release/bundle/nsis/*-setup.exe'

      - name: Attest unsigned installer SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'attest-candidate/src-tauri/target/release/bundle/nsis/*-setup.exe'
          sbom-path: 'attest-candidate/build/guardian.spdx.json'

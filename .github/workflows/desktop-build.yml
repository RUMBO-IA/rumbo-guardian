name: Guardian Desktop Build

on:
  pull_request:
    branches:
      - packaging/rf-foundation
  push:
    branches:
      - packaging/desktop-foundation-v1

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release foundation
        run: npm run release:validate

      - name: Validate desktop packaging policy
        run: node tests/desktop-packaging.test.js

      - name: Stage desktop assets
        run: npm run desktop:assets

      - name: Generate Rust lockfile candidate
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Check Rust shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Guardian syntax checks
        run: npm run check

      - name: Run Guardian regression suite
        run: npm test

      - name: Build unsigned NSIS installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked

      - name: Upload Rust lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: rumbo-guardian-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumbo-guardian-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

name: RUMBO Actions Cache Inventory R1

on:
  push:
    branches:
      - ops/actions-cache-inventory-r1-20261007

permissions:
  actions: read
  contents: read

concurrency:
  group: rumbo-actions-cache-inventory-r1
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: rumbo-ci-linux
    timeout-minutes: 10
    steps:
      - name: Inventory Actions caches read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          items = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/caches?per_page=100&page={page}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "rumbo-cache-inventory-r1",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)
              batch = payload.get("actions_caches", [])
              items.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 50:
                  raise RuntimeError("cache pagination exceeded fail-closed page cap")
          rows = [{
              "id": item.get("id"),
              "key": item.get("key"),
              "ref": item.get("ref"),
              "size_in_bytes": item.get("size_in_bytes"),
              "created_at": item.get("created_at"),
              "last_accessed_at": item.get("last_accessed_at"),
              "version": item.get("version"),
          } for item in items]
          rows.sort(key=lambda r: int(r.get("size_in_bytes") or 0), reverse=True)
          total = sum(int(r.get("size_in_bytes") or 0) for r in rows)
          print("RUMBO_ACTIONS_CACHE_INVENTORY_V1")
          print("cache_count=" + str(len(rows)))
          print("cache_total_bytes=" + str(total))
          print("cache_total_mib=" + f"{total / 1024 / 1024:.2f}")
          for row in rows:
              print(json.dumps(row, sort_keys=True, separators=(",", ":")))
          PY

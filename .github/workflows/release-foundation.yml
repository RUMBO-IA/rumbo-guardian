name: Release Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'packaging/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release:validate
      - run: node tests/release-foundation.test.js
      - run: npm run check
      - run: npm test

name: Desktop Foundation RED

on:
  pull_request:
    branches:
      - packaging/rf-foundation
  push:
    branches:
      - packaging/desktop-foundation-v1

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/desktop-packaging.test.js

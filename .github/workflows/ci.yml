name: Guardian CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install immutable developer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks through local Turborepo
        run: TURBO_TELEMETRY_DISABLED=1 npx --no-install turbo run check
      - name: GitHub Actions supply-chain policy
        run: node tests/github-actions-supply-chain.test.js
      - name: Unit and portfolio tests
        run: npm test

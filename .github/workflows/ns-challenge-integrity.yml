name: Navier-Stokes challenge integrity R68

on:
  push:
    branches:
      - audit/ns-challenge-integrity-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_SHA: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
      FORMAL_CONJECTURES_SHA: 8bf45ed70d48b2b2a501de9c00b26bfa38c573ee
      OPENAI_CHALLENGE_BLOB: 673fb19e26e60818d446363afd953f618719f99b
      UPSTREAM_NS_BLOB: 6fd45b55c78e49ec79f45f4e226a9b9f71f57a81
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact independent and adapted challenge sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google-deepmind/formal-conjectures/$FORMAL_CONJECTURES_SHA/FormalConjectures/Millenium/NavierStokes.lean" \
            -o "$RUNNER_TEMP/upstream.lean"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/openai/NavierStokesAndEuler/$OPENAI_SHA/ComparatorChallenges/NavierStokes.lean" \
            -o "$RUNNER_TEMP/adapted.lean"

      - name: Verify immutable Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RUNNER_TEMP/upstream.lean")" = "$UPSTREAM_NS_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/adapted.lean")" = "$OPENAI_CHALLENGE_BLOB"
          echo "upstream_blob=$UPSTREAM_NS_BLOB"
          echo "adapted_blob=$OPENAI_CHALLENGE_BLOB"

      - name: Compare semantic core declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/upstream.lean" "$RUNNER_TEMP/adapted.lean" <<'PY'
          import re, sys, hashlib
          from pathlib import Path

          upstream = Path(sys.argv[1]).read_text(encoding='utf-8')
          adapted = Path(sys.argv[2]).read_text(encoding='utf-8')

          def strip_block_comments(s: str) -> str:
              out=[]; i=0; depth=0
              while i < len(s):
                  if i+1 < len(s) and s[i:i+2] == '/-':
                      depth += 1; i += 2; continue
                  if depth and i+1 < len(s) and s[i:i+2] == '-/':
                      depth -= 1; i += 2; continue
                  if depth == 0:
                      out.append(s[i])
                  i += 1
              if depth:
                  raise SystemExit('unterminated Lean block comment')
              return ''.join(out)

          def prep(s: str) -> str:
              s = strip_block_comments(s)
              s = re.sub(r'(?m)^\s*--.*$', '', s)
              s = re.sub(r'(?ms)^\s*@\[[^\]]*\]\s*', '', s)
              return s

          DECL = re.compile(r'(?m)^(?:noncomputable\s+)?(?:def|structure|theorem)\s+([A-Za-z0-9_]+)\b')

          def blocks(s: str):
              s=prep(s)
              matches=list(DECL.finditer(s))
              result={}
              for idx,m in enumerate(matches):
                  start=m.start(); end=matches[idx+1].start() if idx+1 < len(matches) else len(s)
                  block=s[start:end]
                  block=re.sub(r'(?m)^\s*end\s+[^\n]+\s*$', '', block)
                  result[m.group(1)] = block
              return result

          def norm(block: str, *, theorem_statement=False) -> str:
              if theorem_statement:
                  block = block.split(':= by',1)[0]
              block = re.sub(r'\s+', ' ', block).strip()
              return block

          u=blocks(upstream); a=blocks(adapted)
          targets=[
              ('IsOnePeriodic', False),
              ('InitialVelocityCondition', False),
              ('InitialVelocityConditionDecay', False),
              ('InitialVelocityConditionPeriodic', False),
              ('ForceCondition', False),
              ('ForceConditionDecay', False),
              ('ForceConditionPeriodic', False),
              ('NavierStokesExistenceAndSmoothness', False),
              ('NavierStokesExistenceAndSmoothnessRn', False),
              ('NavierStokesExistenceAndSmoothnessPeriodic', False),
              ('navier_stokes_breakdown_R3', True),
              ('navier_stokes_breakdown_periodic', True),
          ]

          failures=[]
          for name,is_theorem in targets:
              if name not in u or name not in a:
                  failures.append((name,'missing declaration'))
                  continue
              un=norm(u[name], theorem_statement=is_theorem)
              an=norm(a[name], theorem_statement=is_theorem)
              uh=hashlib.sha256(un.encode()).hexdigest()
              ah=hashlib.sha256(an.encode()).hexdigest()
              print(f'{name}: upstream={uh} adapted={ah}')
              if un != an:
                  failures.append((name, f'mismatch\nUPSTREAM: {un}\nADAPTED: {an}'))

          # divergence is one-line in both sources; compare its type/RHS directly while
          # ignoring the upstream/local notation declarations that intentionally differ.
          def divergence_decl(s: str) -> str:
              s=prep(s)
              m=re.search(r'def\s+divergence\s+\(v\s*:\s*ℝ\^n\s*→\s*ℝ\^n\)\s*\(x\s*:\s*ℝ\^n\)\s*:\s*ℝ\s*:=\s*[^\n]+', s)
              if not m: raise SystemExit('divergence declaration not found')
              return re.sub(r'\s+',' ',m.group(0)).strip()
          du,da=divergence_decl(upstream),divergence_decl(adapted)
          print('divergence:', hashlib.sha256(du.encode()).hexdigest(), hashlib.sha256(da.encode()).hexdigest())
          if du != da:
              failures.append(('divergence', f'mismatch\nUPSTREAM: {du}\nADAPTED: {da}'))

          if failures:
              for name,detail in failures:
                  print(f'FAIL {name}: {detail}', file=sys.stderr)
              raise SystemExit(1)
          print(f'SEMANTIC_CORE_MATCH={len(targets)+1}/13')
          PY

      - name: Verify adaptation boundary only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'import Mathlib' "$RUNNER_TEMP/adapted.lean"
          test "$(grep -c '^import ' "$RUNNER_TEMP/adapted.lean")" -eq 1
          grep -Fq 'namespace NavierStokes.Comparator' "$RUNNER_TEMP/adapted.lean"
          grep -Fq 'namespace NavierStokes' "$RUNNER_TEMP/upstream.lean"
          grep -Fq 'theorem navier_stokes_breakdown_R3' "$RUNNER_TEMP/upstream.lean"
          grep -Fq 'theorem navier_stokes_breakdown_periodic' "$RUNNER_TEMP/upstream.lean"

      - name: Receipt
        if: always()
        shell: bash
        run: |
          {
            echo '# R68 Navier-Stokes challenge integrity receipt'
            echo
            echo "Harness commit: $GITHUB_SHA"
            echo "OpenAI proof SHA: $OPENAI_SHA"
            echo "Formal Conjectures SHA: $FORMAL_CONJECTURES_SHA"
            echo "Upstream blob: $UPSTREAM_NS_BLOB"
            echo "Adapted challenge blob: $OPENAI_CHALLENGE_BLOB"
            echo "Runner: $RUNNER_NAME / $RUNNER_OS / $RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"

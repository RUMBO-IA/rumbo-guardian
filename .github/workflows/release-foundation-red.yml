name: Release Foundation Tests
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'packaging/**'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/release-foundation.test.js
